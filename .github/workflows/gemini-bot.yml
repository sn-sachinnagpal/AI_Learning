name: Gemini Issue Assistant

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  run-gemini:
    if: (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@gemini-cli')) || (github.event_name == 'issues' && contains(github.event.issue.body, '@gemini-cli'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gemini Assistant
        uses: google-github-actions/run-gemini-cli@main
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: ${{ github.event.comment.body || github.event.issue.body }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
